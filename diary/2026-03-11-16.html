                <h4>自分のことを顧みることって不可能では</h4>
                    <p>
                        とても難しいのではと常々思っているのです。考えや記憶は頭の中にあるので、それを外側に出すというのがとても好きじゃないのです。
                        <br>あと、何かプライドみたいなのが働いてしまって、生の奴を取り出せないとも思うのです。その奴にとても愛着があるから
                        <br>守りたいみたいな。私は母になるべきなのか? 母性だ! そんなわけないですね。
                        <br>つまり、自分は自分のことを自分で表現できないカスなのです。どうしようもなく自分のことが鬱陶しく感じるのはこのせいに一票。
                    </p>
