                <h4>12月でもサンダルの出番はあります</h4>
                    <p>
                        12月ですが、私には関係ないです。サンダルがいるので。太陽が顔を出している時に限りますが。
                        <br>少し早いですが沖縄へ行く予定を立てました。どんな所でも初めてだと
                        <br>全ての光景が魔法がかかったように美しく見えてしまいませんか？
                        <br>ただその前に、身の回りのことを整える必要がありそうです。
                        <br>あ、有孔ボードももうすぐ届きます。待ち遠しいですね。わくわく！
